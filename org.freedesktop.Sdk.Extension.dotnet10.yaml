app-id: org.freedesktop.Sdk.Extension.dotnet10
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet10/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet10/lib
      - ln -s /usr/lib/sdk/dotnet10/lib/dotnet /usr/lib/sdk/dotnet10/bin/dotnet
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0.203/dotnet-sdk-10.0.203-linux-x64.tar.gz
        sha256: 434e109c604c55e45f4d317957b4e2f093ee19ceeccdb7f880b97bdf5b96fa32
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz
      - type: archive
        only-arches: [aarch64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0.203/dotnet-sdk-10.0.203-linux-arm64.tar.gz
        sha256: 1ce569940a7d7718df6702e0628e70183ea8a839f56902a8a2c700865c584bcc
