app-id: org.freedesktop.Sdk.Extension.dotnet10
branch: '25.08'
runtime: org.freedesktop.Sdk
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet10/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet10/lib
      - ln -s /usr/lib/sdk/dotnet10/lib/dotnet /usr/lib/sdk/dotnet10/bin/dotnet
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0.201/dotnet-sdk-10.0.201-linux-x64.tar.gz
        sha256: ac6b0ea9aae5d96ee5c41fed1d11c1d5c6bf8d994c75389da8055bea23e44eef
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz
      - type: archive
        only-arches: [aarch64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0.201/dotnet-sdk-10.0.201-linux-arm64.tar.gz
        sha256: d46273b9514a13271dd7b668758622bfb335e7630911631322c42289e84d3962
