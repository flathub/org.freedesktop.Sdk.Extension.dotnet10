app-id: org.freedesktop.Sdk.Extension.dotnet10
branch: '24.08'
runtime: org.freedesktop.Sdk
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false
modules:
  - name: dotnet-sdk
    buildsystem: simple
    build-commands:
      - mkdir -p /usr/lib/sdk/dotnet10/{bin,lib}
      - cp -r * /usr/lib/sdk/dotnet10/lib
      - ln -s /usr/lib/sdk/dotnet10/lib/dotnet /usr/lib/sdk/dotnet10/bin/dotnet
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0.302/dotnet-sdk-10.0.302-linux-x64.tar.gz
        sha256: 264a838d6f5d1a252489c7bb2e2946a579d6a881391d50ffd175a01e4d948c1c
        x-checker-data:
          type: html
          url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0/latest.version
          version-pattern: ^([\d\.a-z-]+)$
          url-template: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/$version/dotnet-sdk-$version-linux-x64.tar.gz
      - type: archive
        only-arches: [aarch64]
        url: https://dotnetcli.blob.core.windows.net/dotnet/Sdk/10.0.302/dotnet-sdk-10.0.302-linux-arm64.tar.gz
        sha256: 1c56318e4099990719f6369184e08bbad0248c09c5ad7532d2516e3cdfc3ab6d
